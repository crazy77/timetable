<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="description" content="2026학년도 1학기 시간표" />
  <title>뷰티디자인과 시간표</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-blobs" aria-hidden="true">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="blob blob-4"></div>
  </div>
  <div id="app">
    <!-- 헤더 -->
    <header class="header">
      <div class="header-content">
        <h1 class="header-title">📚 뷰티디자인과 시간표</h1>
        <p class="header-subtitle">2026학년도 1학기 · <span id="totalCredits"></span>학점</p>
      </div>
      <div class="header-actions">
        <button class="view-toggle-btn" id="viewToggle" aria-label="보기 전환" type="button">
          <svg title="그리드 뷰" id="gridIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <title>그리드 뷰</title>
            <rect x="3" y="3" width="7" height="7" rx="1"/>
            <rect x="14" y="3" width="7" height="7" rx="1"/>
            <rect x="3" y="14" width="7" height="7" rx="1"/>
            <rect x="14" y="14" width="7" height="7" rx="1"/>
          </svg>
          <svg id="listIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none">
            <title>리스트 뷰</title>
            <line x1="3" y1="6" x2="21" y2="6"/>
            <line x1="3" y1="12" x2="21" y2="12"/>
            <line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>
      </div>
    </header>


    <!-- 오늘의 수업 배너 -->
    <section class="today-banner" id="todayBanner">
      <div class="today-header">
        <div class="today-label">
          <span class="today-dot"></span>
          <span id="todayText">오늘의 수업</span>
        </div>
        <div class="today-controls">
          <div class="today-nav">
            <button class="nav-btn" id="prevDay" type="button" aria-label="이전날">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><title>이전날</title><polyline points="15 18 9 12 15 6"></polyline></svg>
            </button>
            <button class="nav-btn" id="nextDay" type="button" aria-label="다음날">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><title>다음날</title><polyline points="9 18 15 12 9 6"></polyline></svg>
            </button>
          </div>
          <button class="fold-btn" id="todayFold" type="button" aria-label="접기/펴기">
            <svg id="foldIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><title>접기/펴기</title><polyline points="6 9 12 15 18 9"></polyline></svg>
          </button>
        </div>
      </div>
      <div class="today-classes" id="todayClasses"></div>
    </section>
    

    <!-- 시간표 그리드 뷰 -->
    <section class="timetable-container" id="timetableGrid">
      <div class="timetable-scroll">
        <table class="timetable" id="timetable">
          <thead>
            <tr>
              <th class="time-header" width="25" style="font-size: 9px;">시간</th>
              <th data-day="월">월</th>
              <th data-day="화">화</th>
              <th data-day="수">수</th>
              <th data-day="목">목</th>
              <th data-day="금">금</th>
            </tr>
          </thead>
          <tbody id="timetableBody"></tbody>
        </table>
      </div>
    </section>

    <!-- 리스트 뷰 -->
    <section class="list-container" id="listView" style="display:none">
      <div class="list-content" id="listContent"></div>
    </section>

    <!-- 과목 상세 모달 -->
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal" id="modal">
        <div class="modal-handle"></div>
        <button class="modal-close" id="modalClose" type="button">&times;</button>
        <div class="modal-body" id="modalBody"></div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
